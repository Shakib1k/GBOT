<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <style>
        body { margin: 0; font-family: Arial; background: #0f0f13; color: white; display: flex; }
        .sidebar { width: 250px; background: #1e1e24; height: 100vh; padding: 20px; box-sizing: border-box; }
        .sidebar a { display: block; color: #aaa; text-decoration: none; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        .sidebar a:hover { background: #2a2a35; color: white; }
        .main { flex: 1; padding: 40px; }
        .card { background: #1e1e24; padding: 20px; border-radius: 10px; display: inline-block; margin-right: 20px; text-align: center; }
        h1 { margin-top: 0; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="color: #4CAF50;">Admin Panel</h2>
        <a href="/dashboard">Dashboard</a>
        <a href="/manage_users">User Create & Manage</a>
        <a href="#" onclick="alert('Coming soon!')">User APKs</a>
        <a href="/admin" style="margin-top: 50px; color: #ff5555;">Logout</a>
    </div>
    <div class="main">
        <h1>Welcome, Admin 👋</h1>
        <div class="card">
            <h3>Total Active Users</h3>
            <h1 style="color: #4CAF50;">{{ total_users }}</h1>
        </div>
    </div>
</body>
</html>
