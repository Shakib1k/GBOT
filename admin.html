<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        body { background-color: #0f0f13; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Login Section */
        #login-section { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; }
        .login-box { background: #1e1e24; padding: 40px; border-radius: 10px; text-align: center; width: 300px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .login-box input { width: 90%; padding: 12px; margin: 15px 0; border-radius: 5px; border: 1px solid #333; background: #2a2a35; color: white; }
        .login-box button { width: 100%; padding: 12px; background: #4CAF50; border: none; color: white; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        
        /* Dashboard Section */
        #dashboard-section { display: none; width: 100%; height: 100%; }
        .sidebar { width: 250px; background: #1e1e24; height: 100vh; padding: 20px; box-sizing: border-box; border-right: 1px solid #333; }
        .sidebar h2 { color: #4CAF50; text-align: center; margin-bottom: 30px; }
        .sidebar a { display: block; color: #aaa; text-decoration: none; padding: 12px; margin-bottom: 10px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { background: #2a2a35; color: white; }
        
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .card { background: #1e1e24; padding: 25px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .form-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .form-group input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #333; background: #2a2a35; color: white; }
        .form-group button { padding: 10px 20px; background: #4CAF50; border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { color: #4CAF50; }
        
        .error-msg { color: #ff4444; display: none; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- LOGIN PAGE -->
    <div id="login-section">
        <div class="login-box">
            <h2>🔒 Admin Login</h2>
            <input type="password" id="admin-pass" placeholder="Enter Password">
            <button onclick="checkLogin()">Login</button>
            <p class="error-msg" id="error-msg">❌ Wrong Password!</p>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-section">
        <div class="sidebar">
            <h2>Admin Panel</h2>
            <a onclick="showTab('dashboard')" class="active" id="tab-dashboard">📊 Dashboard</a>
            <a onclick="showTab('users')" id="tab-users">👥 User Create</a>
            <a onclick="logout()" style="color: #ff5555; margin-top: 50px;">🚪 Logout</a>
        </div>

        <div class="main-content">
            <!-- Dashboard Tab -->
            <div id="view-dashboard">
                <h1>Welcome, Admin 👋</h1>
                <div class="card" style="display: inline-block; width: 200px; text-align: center;">
                    <h3>Total Users</h3>
                    <h1 style="color: #4CAF50; margin: 10px 0;">0</h1>
                </div>
            </div>

            <!-- Users Tab -->
            <div id="view-users" style="display: none;">
                <div class="card">
                    <h2>Generate New Key</h2>
                    <div class="form-group">
                        <input type="text" id="user-id" placeholder="Telegram User ID">
                        <input type="number" id="credits" value="10" placeholder="Credits">
                        <button onclick="generateKey()">Generate Key</button>
                    </div>
                </div>

                <div class="card">
                    <h2>Generated Keys</h2>
                    <table>
                        <thead>
                            <tr><th>Key</th><th>User ID</th><th>Credits</th></tr>
                        </thead>
                        <tbody id="key-table">
                            <tr><td colspan="3" style="text-align:center;">No keys generated yet.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "Shakib.12"; // আপনার পাসওয়ার্ড

        function checkLogin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'flex';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function showTab(tab) {
            document.getElementById('view-dashboard').style.display = 'none';
            document.getElementById('view-users').style.display = 'none';
            document.getElementById('tab-dashboard').classList.remove('active');
            document.getElementById('tab-users').classList.remove('active');

            if (tab === 'dashboard') {
                document.getElementById('view-dashboard').style.display = 'block';
                document.getElementById('tab-dashboard').classList.add('active');
            } else {
                document.getElementById('view-users').style.display = 'block';
                document.getElementById('tab-users').classList.add('active');
            }
        }

        function logout() {
            location.reload();
        }

        function generateKey() {
            const uid = document.getElementById('user-id').value;
            const credit = document.getElementById('credits').value;
            
            if(!uid || !credit) { alert("Please fill all fields!"); return; }
            
            // এখানে ডামি কী জেনারেট হচ্ছে (আসল সিস্টেমে এটি সার্ভারে সেভ হবে)
            const randomKey = Math.random().toString(36).substring(2, 12).toUpperCase();
            
            const tbody = document.getElementById('key-table');
            if(tbody.innerHTML.includes("No keys")) tbody.innerHTML = '';
            
            tbody.innerHTML += `<tr><td>${randomKey}</td><td>${uid}</td><td>${credit}</td></tr>`;
            alert("Key Generated Successfully!\n\n" + randomKey);
        }
    </script>
</body>
</html>
