<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>
        body { background: #0f0f13; color: white; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e1e24; padding: 40px; border-radius: 10px; text-align: center; width: 300px; }
        input { width: 90%; padding: 10px; margin: 20px 0; border-radius: 5px; border: none; background: #2a2a35; color: white; }
        button { width: 100%; padding: 10px; background: #4CAF50; border: none; color: white; border-radius: 5px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔒 Admin Login</h2>
        <form method="POST">
            <input type="password" name="password" placeholder="Enter Password" required>
            <button type="submit">Login</button>
        </form>
        <p style="color: red;">{{ error }}</p>
    </div>
</body>
</html>
