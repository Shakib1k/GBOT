<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DCP MODS · Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #05070A; --card: rgba(15, 22, 40, 0.7); --primary: #00E5FF; --secondary: #9D4EDD; 
            --green: #00D084; --red: #FF5252; --yellow: #FFAA00; --text: #E2E8F0; --muted: #94A3B8; --border: rgba(0,229,255,0.15); 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding-bottom: 80px; }
        
        .topbar { position: sticky; top: 0; z-index: 100; background: rgba(5, 7, 10, 0.8); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--border); }
        .brand { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 900; color: #fff; letter-spacing: 1px; }
        .brand span { color: var(--primary); }

        .main { padding: 20px; max-width: 600px; margin: 0 auto; padding-top: 24px; padding-bottom: 100px;}
        .page { display: none; animation: fadeIn 0.3s ease-out; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .page-title { font-family: 'Orbitron', sans-serif; font-size: 20px; margin-bottom: 20px; color: #fff; display: flex; align-items: center; gap: 10px; }
        .page-title::before { content: ''; display: block; width: 3px; height: 20px; background: var(--primary); border-radius: 3px; }

        .card { background: var(--card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .card h3 { font-size: 14px; color: var(--primary); margin-bottom: 15px; font-family: 'Orbitron', sans-serif; }

        label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; font-weight: 700; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 14px; background: rgba(0,0,0,0.4); border: 1px solid #333; border-radius: 10px; color: #fff; outline: none; font-family: 'Inter', sans-serif; font-size: 14px; margin-bottom: 12px; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0,229,255,0.1); }
        
        .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; cursor: pointer; font-weight: 800; font-family: 'Orbitron', sans-serif; font-size: 14px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #000; transition: 0.2s; }
        .btn:active { transform: scale(0.97); }
        
        .list-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; }
        .list-header { display: flex; justify-content: space-between; align-items: center; }
        .list-key { font-family: 'Orbitron', monospace; font-weight: 700; font-size: 14px; color: #fff; }
        .list-details { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .badge.ok { background: rgba(0,208,132,0.15); color: var(--green); border: 1px solid rgba(0,208,132,0.3); }
        .badge.warn { background: rgba(255,82,82,0.15); color: var(--red); border: 1px solid rgba(255,82,82,0.3); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10, 15, 28, 0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 10px; font-weight: 600; cursor: pointer; transition: 0.3s; width: 25%; }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
        .nav-item.active { color: var(--primary); }
        
        #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); padding: 12px 20px; background: rgba(15,22,40,0.95); border: 1px solid var(--primary); border-radius: 10px; font-size: 13px; font-weight: 600; opacity: 0; transition: 0.3s; z-index: 1000; pointer-events: none; width: max-content; }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 30px; width: 100%; max-width: 400px; text-align: center; }
        
        .stats-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-bottom:15px; }
        .stat-card { background:linear-gradient(145deg,rgba(0,229,255,.10),rgba(157,78,221,.08)); border:1px solid var(--border); border-radius:14px; padding:16px; }
        .stat-label { color:var(--muted); font-size:10px; font-weight:800; letter-spacing:1px; text-transform:uppercase; }
        .stat-value { color:#fff; font:900 25px 'Orbitron',sans-serif; margin-top:8px; }
    </style>
</head>
<body>
    <div id="loginOverlay">
        <div class="login-card">
            <h2 style="font-family: 'Orbitron', sans-serif; color: var(--primary); margin-bottom: 20px;">DCP MODS ADMIN</h2>
            <label>Enter Admin Password</label>
            <input type="password" id="loginPass" placeholder="••••••••">
            <button class="btn" onclick="login()">Login to Admin Panel</button>
        </div>
    </div>

    <div class="topbar">
        <div class="brand">DCP<span>MODS.ADMIN</span></div>
    </div>

    <div class="main">
        <!-- Dashboard Page -->
        <div id="page-dashboard" class="page active">
            <div class="page-title">Dashboard</div>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-label">Total Keys</div><div class="stat-value" id="statKeys">0</div></div>
                <div class="stat-card"><div class="stat-label">Active Users</div><div class="stat-value" id="statUsers">0</div></div>
            </div>
            <div class="card">
                <h3>Quick Actions</h3>
                <button class="btn" onclick="loadData()">🔄 Refresh Data</button>
            </div>
        </div>

        <!-- Create User Page -->
        <div id="page-create" class="page">
            <div class="page-title">Create User</div>
            <div class="card">
                <label>Telegram User ID</label>
                <input type="text" id="c_user_id" placeholder="e.g. 123456789">
                <label>Credits</label>
                <input type="number" id="c_credits" value="10">
                <label>Custom Key (Optional)</label>
                <input type="text" id="c_custom_key" placeholder="Leave blank for auto-generate">
                <button class="btn" onclick="createUser()">➕ Create User Key</button>
            </div>
        </div>

        <!-- View Users Page -->
        <div id="page-users" class="page">
            <div class="page-title">All Users</div>
            <div id="usersList"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="nav('dashboard', this)">
            <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg><span>Home</span>
        </div>
        <div class="nav-item" onclick="nav('create', this)">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Create</span>
        </div>
        <div class="nav-item" onclick="nav('users', this)">
            <svg viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg><span>Users</span>
        </div>
    </div>

    <div id="toast">Saved!</div>

    <script>
        // ⚠️ শুধু আপনার পাসওয়ার্ডটি এখানে দিন
        const ADMIN_PASSWORD = "Shakib.12"; 
        
        // এটি অটোমেটিক আপনার Render সার্ভারের লিংক ধরে নেবে
        const API_BASE = window.location.origin; 

        function login() {
            const pass = document.getElementById('loginPass').value;
            if (pass !== ADMIN_PASSWORD) {
                alert("Wrong Password!");
                return;
            }
            sessionStorage.setItem('adminAuth', 'true');
            document.getElementById('loginOverlay').style.display = 'none';
            loadData();
        }

        // পেজ রিফ্রেশ হলে লগইন থাকলে সরাসরি ড্যাশবোর্ডে নিয়ে যাবে
        if (sessionStorage.getItem('adminAuth') === 'true') {
            document.getElementById('loginOverlay').style.display = 'none';
            loadData();
        }

        function nav(page, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('page-' + page).classList.add('active'); 
            el.classList.add('active');
            if(page === 'users') loadData();
        }

        async function loadData() {
            try {
                // আপনার Render সার্ভারের API থেকে ডাটা লোড করছে
                const res = await fetch(API_BASE + '/api/get_users');
                const data = await res.json();
                
                document.getElementById('statKeys').innerText = data.length;
                document.getElementById('statUsers').innerText = data.filter(u => u.credits > 0).length;
                
                renderUsers(data);
            } catch (e) {
                console.error(e);
                toast("Failed to load data. Server might be asleep or error.", true);
            }
        }

        function renderUsers(users) {
            const container = document.getElementById('usersList');
            if(users.length === 0) {
                container.innerHTML = '<div class="card" style="text-align:center;">No users found. Create one!</div>';
                return;
            }
            container.innerHTML = users.map(u => `
                <div class="list-item">
                    <div class="list-header">
                        <div class="list-key">${u.user_id}</div>
                        <div class="badge ${u.credits > 0 ? 'ok' : 'warn'}">${u.credits} Credits</div>
                    </div>
                    <div class="list-details">
                        <span>Key: <b>${u.key}</b></span>
                        <span>Status: ${u.used ? 'Used' : 'Unused'}</span>
                    </div>
                </div>
            `).join('');
        }

        async function createUser() {
            const uid = document.getElementById('c_user_id').value;
            const credits = document.getElementById('c_credits').value;
            const customKey = document.getElementById('c_custom_key').value;

            if(!uid || !credits) return toast("Please fill all required fields!", true);

            try {
                const res = await fetch(API_BASE + '/api/create_user', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: uid, credits: parseInt(credits), key: customKey })
                });
                const result = await res.json();
                
                if(result.success) {
                    toast("User Created Successfully!");
                    alert(`User Created!\n\nKey: ${result.key}\nGive this key to the user to login.`);
                    document.getElementById('c_user_id').value = "";
                    document.getElementById('c_custom_key').value = "";
                    loadData();
                    // অটোমেটিক 'Users' ট্যাবে চলে যাবে
                    nav('users', document.querySelectorAll('.nav-item')[2]);
                } else {
                    toast("Failed to create user.", true);
                }
            } catch (e) {
                toast("Server error.", true);
            }
        }

        function toast(msg, isErr = false) {
            const el = document.getElementById('toast'); 
            el.textContent = msg;
            el.style.borderColor = isErr ? 'var(--red)' : 'var(--green)';
            el.classList.add('show'); 
            setTimeout(() => el.classList.remove('show'), 2500);
        }
    </script>
</body>
</html>
