<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - VIP BOT</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e2f; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #2a2a40; padding: 20px; border-radius: 10px; }
        h1 { text-align: center; color: #4CAF50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border-radius: 5px; border: none; }
        button { background: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #45a049; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Admin Control Panel</h1>
        <div class="form-group">
            <label>User Telegram ID</label>
            <input type="text" id="userId" placeholder="e.g. 123456789">
        </div>
        <div class="form-group">
            <label>Credits to Add</label>
            <input type="number" id="credits" value="10">
        </div>
        <button onclick="generateKey()">Generate New Key</button>

        <h2 style="margin-top: 40px; text-align: center;">📋 Generated Keys</h2>
        <table id="keyTable">
            <thead>
                <tr><th>Key</th><th>User ID</th><th>Credits</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        // এখানে আপনার Render এর ডোমেইন বসাবেন
        const API_URL = "https://your-app-name.onrender.com"; 

        async function generateKey() {
            const userId = document.getElementById('userId').value;
            const credits = document.getElementById('credits').value;

            if(!userId || !credits) {
                alert("Please enter User ID and Credits!");
                return;
            }

            const response = await fetch(API_URL + '/generate_key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, credits: credits })
            });

            const data = await response.json();
            if(data.success) {
                alert("Key Generated: " + data.key);
                location.reload(); // পেজ রিফ্রেশ হবে
            } else {
                alert("Error generating key");
            }
        }

        async function loadKeys() {
            const response = await fetch(API_URL + '/get_keys');
            const data = await response.json();
            const tbody = document.querySelector('#keyTable tbody');
            tbody.innerHTML = '';
            
            data.forEach(item => {
                tbody.innerHTML += `<tr><td>${item.key}</td><td>${item.user_id}</td><td>${item.credits}</td></tr>`;
            });
        }
        loadKeys();
    </script>
</body>
</html>
